<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主題抽獎機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="lunar" class="min-h-screen text-white overflow-x-hidden">
    <div id="stars"></div>
    <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
      <main class="themed-panel w-full max-w-4xl backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-2xl">
        <header class="text-center mb-6">
          <div class="flex justify-end mb-2">
            <button id="themeToggle" class="theme-toggle px-4 py-2 rounded-xl font-bold text-sm md:text-base transition active:scale-95">
              🌌 切換銀河版
            </button>
          </div>
          <h1 id="mainTitle" class="text-3xl md:text-4xl font-extrabold tracking-wide">🧧 新春好運抽獎機 🧧</h1>
          <p id="subtitle" class="themed-subtext mt-3">紅色喜氣主題、金色點綴、開春抽出好彩頭！</p>
        </header>

        <section class="grid md:grid-cols-2 gap-4 mb-6">
          <label class="block">
            <span class="themed-subtext text-sm">起始號碼</span>
            <input id="startNumber" type="number" value="2" class="themed-input mt-1 w-full rounded-xl px-4 py-3 focus:outline-none" />
          </label>
          <label class="block">
            <span class="themed-subtext text-sm">結束號碼</span>
            <input id="endNumber" type="number" value="49" class="themed-input mt-1 w-full rounded-xl px-4 py-3 focus:outline-none" />
          </label>
        </section>

        <section class="text-center mb-6">
          <div id="drawDisplay" class="themed-display number-display mx-auto mb-4 flex items-center justify-center text-7xl md:text-8xl font-black rounded-3xl">--</div>
          <div id="feedback" class="h-7 text-amber-200 text-sm font-semibold" aria-live="polite"></div>
          <div class="themed-subtext mt-2">剩餘號碼：<span id="remainingCount" class="themed-highlight font-bold">0</span></div>
        </section>

        <section class="flex flex-col sm:flex-row gap-3 justify-center mb-6">
          <button id="drawButton" class="draw-action rounded-xl px-8 py-3 font-bold transition hover:brightness-110 active:scale-95">
            🧨 開始抽獎
          </button>
          <button id="resetButton" class="reset-action rounded-xl px-8 py-3 font-bold transition active:scale-95">
            🏮 重置
          </button>
        </section>

        <section class="history-panel rounded-2xl p-4">
          <h2 id="historyTitle" class="text-lg font-bold mb-3">🧮 已抽出號碼</h2>
          <ul id="drawnList" class="flex flex-wrap gap-2 min-h-12"></ul>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
